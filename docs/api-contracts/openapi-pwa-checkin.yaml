openapi: 3.0.3
info:
  title: SÖL Portal PWA gate check-in (SCRUM-75/83/87 extension)
  version: 1.1.0
  description: Member scans a short-lived gate challenge displayed by reception. Existing staff scan and checkout contracts remain unchanged. QR challenges do not establish physical proximity or control barrier hardware.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /check-in/streak:
    get:
      summary: Get the signed-in member's workout streak and 13-week activity grid
      description: MEMBER only; identity comes exclusively from the authenticated principal. Counts distinct dates of GRANTED center check-ins in Asia/Ho_Chi_Minh, up to server time. Multiple visits on one day count once. The current streak ends today if checked in today, otherwise yesterday (today remains available to continue it). If neither today nor yesterday has a granted visit, currentStreak is zero; a new visit today after a missed day starts a new streak of one. Longest streak covers all history. Active dates and workoutDays cover the Monday 12 weeks before the current week through today, with future days omitted. No database schema changes.
      responses:
        '200':
          description: Workout streak retrieved; empty history returns zero counters and no active dates
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, description: Localized using Accept-Language (vi default or en) }
                  data: { $ref: '#/components/schemas/WorkoutStreak' }
        '401': { description: Authentication required }
        '403': { description: Member role required }
  /check-in/gate-qr:
    get:
      summary: Create a 60-second signed gate challenge
      description: RECEPTIONIST, CENTER_MANAGER or ADMIN only. Never cache. A challenge may be used by multiple members; existing member anti-passback prevents a second granted entry until checkout.
      parameters:
        - in: query
          name: gate
          schema: { type: string, enum: [A1, A2, B1], default: A1 }
      responses:
        '200':
          description: Challenge ready
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/GateQr' }
        '400': { description: Unknown gate }
        '401': { description: Authentication required }
        '403': { description: Staff role required }
  /check-in/self:
    post:
      summary: Member records own entry using a signed gate QR
      description: MEMBER only. Identity comes from the authenticated principal. The server checks gate signature/lifetime, account status, current active subscription, anti-passback and database membership trigger. No offline queue. Forged, malformed or expired challenges and business denials all return 201 with status DENIED and an audit entry (denialReason localized).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateQr]
              properties:
                gateQr: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '201':
          description: Audited result, GRANTED or DENIED; same CheckinDto as existing staff scan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      id: { type: integer, format: int64 }
                      memberId: { type: integer, format: int64, nullable: true }
                      memberName: { type: string, nullable: true }
                      checkInTime: { type: string, format: date-time }
                      checkOutTime: { type: string, format: date-time, nullable: true }
                      method: { type: string, example: qr }
                      gate: { type: string }
                      status: { type: string, enum: [GRANTED, DENIED] }
                      denialReason: { type: string, nullable: true, description: Localized using Accept-Language (vi default or en) }
                      avatarUrl: { type: string, nullable: true }
                      packageName: { type: string, nullable: true }
                      remainingDays: { type: integer, nullable: true }
        '400': { description: Validation error (blank or oversize gateQr) }
        '401': { description: Authentication required }
        '403': { description: Member role required }
  /check-in/self/checkout:
    post:
      summary: Member checks out by scanning a signed gate QR
      description: MEMBER only. Closes the caller's own open GRANTED visit. Invalid/expired gate QR returns 400 (GATE_QR_INVALID / GATE_QR_EXPIRED); no open visit returns 400 CHECKIN_NO_OPEN_VISIT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateQr]
              properties:
                gateQr: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Checked out; returns CheckinDto with checkOutTime }
        '400': { description: GATE_QR_INVALID, GATE_QR_EXPIRED or CHECKIN_NO_OPEN_VISIT }
        '401': { description: Authentication required }
        '403': { description: Member role required }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    WorkoutStreak:
      type: object
      required: [currentStreak, longestStreak, workoutDays, startDate, endDate, activeDates]
      properties:
        currentStreak: { type: integer, minimum: 0, example: 3 }
        longestStreak: { type: integer, minimum: 0, example: 12 }
        workoutDays: { type: integer, minimum: 0, maximum: 91, example: 24 }
        startDate: { type: string, format: date, description: Monday starting the 13-week grid }
        endDate: { type: string, format: date, description: Today's date at the center }
        activeDates:
          type: array
          uniqueItems: true
          items: { type: string, format: date }
    GateQr:
      type: object
      required: [qrCode, gateId, gate, generatedAt, expiresAt, expiresInSeconds]
      properties:
        qrCode: { type: string, description: 'SOL:GATE:1:<gateId>:<issuedMillis>:<HMAC-SHA256 hex>; signed by the server' }
        gateId: { type: string, enum: [A1, A2, B1] }
        gate: { type: string }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        expiresInSeconds: { type: integer, example: 60 }
