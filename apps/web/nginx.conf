# Preserve HTTPS when an upstream TLS proxy supplies X-Forwarded-Proto.
map $http_x_forwarded_proto $scms_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Docker DNS follows the API's new IP after a container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_backend api:8080;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scms_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # React Router routes must work when opened directly or refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
