name: scms

services:
  api:
    image: ${API_IMAGE:-scms-api:local}
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ${SCMS_ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: supabase
      PORT: "8080"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      DB_SSL_MODE: ${DB_SSL_MODE:-require}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_WEB_ORIGIN: ${APP_WEB_ORIGIN:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:-scms-web:local}
    build:
      context: ./apps/web
      args:
        # Browser requests use the same origin; do not use http://api:8080 here.
        VITE_API_BASE_URL: /api/v1
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
